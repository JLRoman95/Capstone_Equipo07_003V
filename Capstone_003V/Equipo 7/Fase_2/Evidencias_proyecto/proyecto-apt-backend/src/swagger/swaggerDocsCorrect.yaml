    get:
      tags: [Reportes]
      summary: Reporte de stock
      description: Generar reporte completo del estado del inventario en formato JSON o PDF
      security:
        - bearerAuth: []
      parameters:
        - name: formato
          in: query
          description: Formato del reporte
          schema:
            type: string
            enum: [json, pdf]
            default: json
            example: "json"
      responses:
        '200':
          description: Reporte de stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteStock'
            application/pdf:
              schema:
                type: string
                format: binary
                description: Archivo PDF del reporte
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos para generar reportes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/reportes/alertas:
    get:
      tags: [Reportes]
      summary: Reporte de alertas
      description: Generar reporte completo de todas las alertas del sistema en formato JSON o PDF
      security:
        - bearerAuth: []
      parameters:
        - name: formato
          in: query
          description: Formato del reporte
          schema:
            type: string
            enum: [json, pdf]
            default: json
            example: "json"
      responses:
        '200':
          description: Reporte de alertas
          content:
            application/json:
              schema:
                type: object
                properties:
                  resumen:
                    $ref: '#/components/schemas/ConteoAlertas'
                  alertas:
                    type: object
                    properties:
                      sin_stock:
                        type: array
                        items:
                          $ref: '#/components/schemas/Producto'
                      stock_bajo:
                        type: array
                        items:
                          $ref: '#/components/schemas/Producto'
                      caducidad_proxima:
                        type: array
                        items:
                          $ref: '#/components/schemas/InventarioLote'
                      vencidos:
                        type: array
                        items:
                          $ref: '#/components/schemas/InventarioLote'
                  generado:
                    type: string
                    format: date-time
            application/pdf:
              schema:
                type: string
                format: binary
                description: Archivo PDF del reporte
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos para generar reportes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'