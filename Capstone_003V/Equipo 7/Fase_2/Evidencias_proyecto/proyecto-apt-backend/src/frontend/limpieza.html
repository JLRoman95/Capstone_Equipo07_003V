<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Checklist APT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Barra superior -->
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-gray-800">Checklist de Limpieza - APT</h1>
  </header>

  <main class="flex-grow p-6">
    <!-- Botón de volver -->
    <div class="mb-4">
      <button onclick="irAHome()" style="display: inline-block; background-color: #007BFF; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 14px; margin-bottom: 20px;">
        ← Volver
      </button>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-md">
      <!-- Encabezado del checklist -->
      <div class="grid md:grid-cols-2 gap-4 mb-6">
        <div>
          <p class="text-sm font-semibold text-gray-700 mb-1">
            <strong>Fecha:</strong> <span id="fechaActual">Se registrará automáticamente</span>
          </p>
          <p class="text-xs text-gray-500">La fecha y hora se establecen automáticamente</p>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Turno:</label>
          <select id="turno" class="border border-gray-300 rounded-md p-2 w-full">
            <option value="">Seleccionar turno</option>
            <option value="Mañana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
          </select>
        </div>
        <div class="md:col-span-2 flex justify-center">
          <button onclick="crearChecklist()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg shadow-md">
            Crear Checklist
          </button>
        </div>
      </div>

      <!-- Tabla de items -->
      <h2 class="text-lg font-semibold text-gray-800 mb-3">Items del Checklist</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm border border-gray-300 rounded-md overflow-hidden">
          <thead class="bg-gray-100">
            <tr>
              <th class="p-2 border text-left">Descripción</th>
              <th class="p-2 border text-center">OK</th>
              <th class="p-2 border text-center">NO OK</th>
              <th class="p-2 border text-center">N/A</th>
              <th class="p-2 border text-left">Observación</th>
            </tr>
          </thead>
          <tbody id="tabla-items" class="bg-white"></tbody>
        </table>
      </div>

      <div class="mt-6 text-right">
        <button onclick="guardarChecklist()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-md">
          Guardar Checklist
        </button>
      </div>
    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:4000/api';
    let checklistId = null;
    let items = [];

    // Verificar autenticación
    const token = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario'));
    if (!token || !usuario) {
      alert('Debes iniciar sesión para acceder al checklist');
      window.location.href = 'login.html';
    }

    // Helper para hacer peticiones autenticadas
    async function fetchWithAuth(url, options = {}) {
      const config = {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...options.headers
        }
      };
      
      const response = await fetch(url, config);
      
      if (response.status === 401) {
        alert('Sesión expirada. Debes iniciar sesión nuevamente.');
        window.location.href = 'login.html';
        return;
      }
      
      return response;
    }

    // Mostrar fecha actual
    function actualizarFecha() {
      const ahora = new Date();
      const fechaFormateada = ahora.toLocaleDateString('es-ES', {
        day: '2-digit',
        month: '2-digit', 
        year: 'numeric'
      });
      const horaFormateada = ahora.toLocaleTimeString('es-ES', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      
      document.getElementById('fechaActual').textContent = `${fechaFormateada} ${horaFormateada}`;
    }

    // Actualizar fecha cada segundo
    setInterval(actualizarFecha, 1000);
    actualizarFecha();

    function irAHome() {
      window.location.href = 'index.html';
    }

    async function crearChecklist() {
      const turno = document.getElementById('turno').value;

      if (!turno) {
        alert('Por favor selecciona un turno');
        return;
      }

      try {
        const res = await fetchWithAuth(`${API_URL}/checklists`, {
          method: 'POST',
          body: JSON.stringify({ turno })
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || 'Error al crear checklist');
        }

        const data = await res.json();
        checklistId = data.id_checklist;
        items = data.items || [];

        renderItems();
        alert('✅ Checklist creado exitosamente');
      } catch (err) {
        console.error(err);
        alert('❌ No se pudo crear el checklist: ' + err.message);
      }
    }

    function renderItems() {
      const tbody = document.getElementById('tabla-items');
      tbody.innerHTML = '';

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-gray-500">No hay ítems disponibles.</td></tr>`;
        return;
      }

      items.forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-50';
        row.innerHTML = `
          <td class="p-2 border">${item.descripcion}</td>
          <td class="p-2 border text-center"><input type="radio" name="res-${index}" value="ok"></td>
          <td class="p-2 border text-center"><input type="radio" name="res-${index}" value="no_ok"></td>
          <td class="p-2 border text-center"><input type="radio" name="res-${index}" value="na"></td>
          <td class="p-2 border"><input type="text" id="obs-${index}" class="border border-gray-300 rounded-md p-1 w-full" placeholder="Observaciones..."></td>
        `;
        tbody.appendChild(row);
      });
    }

    async function guardarChecklist() {
      if (!checklistId) {
        alert('⚠️ Crea un checklist antes de guardar.');
        return;
      }

      const itemsUpdate = items.map((item, index) => {
        const radios = document.getElementsByName(`res-${index}`);
        let resultado = null;
        radios.forEach(r => { if (r.checked) resultado = r.value; });
        const observacion = document.getElementById(`obs-${index}`).value;
        return { id_item: item.id_item, resultado, observacion };
      });

      try {
        const res = await fetchWithAuth(`${API_URL}/checklists/${checklistId}`, {
          method: 'PUT',
          body: JSON.stringify({ items: itemsUpdate })
        });

        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || 'Error al guardar checklist');
        }

        const data = await res.json();
        alert(`✅ Checklist guardado exitosamente. Estado: ${data.estado}`);
      } catch (err) {
        console.error(err);
        alert('❌ Error al guardar: ' + err.message);
      }
    }
  </script>
</body>
</html>
