<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Alertas - APT</title>
  <style>
    body{font-family:Arial;margin:20px}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #ccc;padding:8px;text-align:left}
    th{background:#333;color:#fff}
    .btn{padding:6px 10px;margin-right:6px;cursor:pointer}
    .volver{
      display: inline-block;
      background-color: #007BFF;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .volver:hover{background-color: #0056b3;}
    .prioridad-critica {
      background-color: #ffebee;
      border-left: 4px solid #f44336;
    }
    .prioridad-alta {
      background-color: #fff3e0;
      border-left: 4px solid #ff9800;
    }
    .prioridad-media {
      background-color: #f3e5f5;
      border-left: 4px solid #9c27b0;
    }
    .prioridad-baja {
      background-color: #e8f5e8;
      border-left: 4px solid #4caf50;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-critica {
      background-color: #f44336;
      color: white;
    }
    .badge-alta {
      background-color: #ff9800;
      color: white;
    }
    .badge-media {
      background-color: #9c27b0;
      color: white;
    }
    .badge-baja {
      background-color: #4caf50;
      color: white;
    }
    .resumen {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .resumen-card {
      padding: 15px;
      border-radius: 8px;
      min-width: 150px;
      text-align: center;
    }
    .resumen-total {
      background-color: #e3f2fd;
      border-left: 4px solid #2196f3;
    }
    .resumen-stock-bajo {
      background-color: #fff3e0;
      border-left: 4px solid #ff9800;
    }
    .resumen-caducidad {
      background-color: #f3e5f5;
      border-left: 4px solid #9c27b0;
    }
    .resumen-vencidos {
      background-color: #ffebee;
      border-left: 4px solid #f44336;
    }
    .resumen-sin-stock {
      background-color: #fce4ec;
      border-left: 4px solid #e91e63;
    }
    .contador {
      font-size: 24px;
      font-weight: bold;
    }
    .no-alertas {
      text-align: center;
      padding: 40px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- Botón Volver -->
  <button class="volver" onclick="volver()">← Volver</button>

  <h1>🚨 Alertas del Sistema</h1>

  <!-- Resumen de alertas -->
  <div class="resumen" id="resumen" style="display: none;">
    <div class="resumen-card resumen-total">
      <div class="contador" id="total-alertas">0</div>
      <div>Total Alertas</div>
    </div>
    <div class="resumen-card resumen-stock-bajo">
      <div class="contador" id="stock-bajo">0</div>
      <div>Stock Bajo</div>
    </div>
    <div class="resumen-card resumen-caducidad">
      <div class="contador" id="caducidad">0</div>
      <div>Próximos a Caducar</div>
    </div>
    <div class="resumen-card resumen-vencidos">
      <div class="contador" id="vencidos">0</div>
      <div>Productos Vencidos</div>
    </div>
    <div class="resumen-card resumen-sin-stock">
      <div class="contador" id="sin-stock">0</div>
      <div>Sin Stock</div>
    </div>
  </div>

  <!-- Tabla de alertas -->
  <table id="tablaAlertas">
    <thead>
      <tr>
        <th>Prioridad</th>
        <th>Tipo</th>
        <th>Descripción</th>
        <th>Detalles</th>
        <th>Generada</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API = 'http://localhost:4000/api/alertas-automaticas';

    // Verificar autenticación
    const token = localStorage.getItem('token');
    if (!token) {
      alert('Debes iniciar sesión para ver las alertas');
      window.location.href = 'login.html';
    }

    function volver() {
      window.location.href = 'index.html';
    }

    async function cargarAlertas() {
      try {
        const res = await fetch(API, {
          headers: { 
            'Accept': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });
        
        if (!res.ok) {
          if (res.status === 401) {
            alert('Sesión expirada. Debes iniciar sesión nuevamente.');
            window.location.href = 'login.html';
            return;
          }
          if (res.status === 403) {
            alert('No tienes permisos para ver las alertas.');
            return;
          }
          const errorData = await res.json().catch(() => ({}));
          throw new Error(errorData.error || `Error ${res.status}: ${res.statusText}`);
        }
        
        const data = await res.json();
        renderAlertas(data);
      } catch (error) {
        console.error('Error detallado:', error);
        // Mostrar error en la tabla en lugar de alert
        const tbody = document.querySelector('#tablaAlertas tbody');
        tbody.innerHTML = `<tr><td colspan="5" class="no-alertas" style="color: red;">
          ❌ Error al cargar alertas: ${error.message}<br>
          <small>Revisa la consola para más detalles</small>
        </td></tr>`;
      }
    }

    function renderAlertas(data) {
      const tbody = document.querySelector('#tablaAlertas tbody');
      tbody.innerHTML = '';
      
      // Mostrar resumen
      const resumen = data.resumen;
      document.getElementById('total-alertas').textContent = resumen.total;
      document.getElementById('stock-bajo').textContent = resumen.stock_bajo;
      document.getElementById('caducidad').textContent = resumen.caducidad;
      document.getElementById('vencidos').textContent = resumen.vencidos;
      document.getElementById('sin-stock').textContent = resumen.sin_stock;
      document.getElementById('resumen').style.display = 'flex';
      
      if (data.alertas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="no-alertas">✅ No hay alertas activas. ¡Todo está bajo control!</td></tr>';
        return;
      }
      
      data.alertas.forEach(alerta => {
        const tr = document.createElement('tr');
        tr.className = `prioridad-${alerta.prioridad}`;
        
        // Formatear tipo
        const tipoTexto = {
          'stock_bajo': 'STOCK BAJO',
          'caducidad': 'PRÓXIMO A CADUCAR',
          'producto_vencido': 'PRODUCTO VENCIDO',
          'stock_critico': 'SIN STOCK'
        }[alerta.tipo] || alerta.tipo.toUpperCase();
        
        // Formatear detalles adicionales
        let detalles = '';
        if (alerta.tipo === 'caducidad' && alerta.dias_restantes !== undefined) {
          detalles = `${alerta.dias_restantes} días restantes`;
          if (alerta.numero_lote) detalles += `<br>Lote: ${alerta.numero_lote}`;
        } else if (alerta.tipo === 'stock_bajo') {
          detalles = `Stock: ${alerta.stock_actual}/${alerta.stock_minimo}`;
        } else if (alerta.tipo === 'stock_critico') {
          detalles = 'Stock agotado';
        } else if (alerta.numero_lote) {
          detalles = `Lote: ${alerta.numero_lote}`;
        }
        
        const fechaGeneracion = new Date(alerta.fecha_generacion).toLocaleString('es-ES', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
        
        tr.innerHTML = `
          <td><span class="badge badge-${alerta.prioridad}">${alerta.prioridad.toUpperCase()}</span></td>
          <td>${tipoTexto}</td>
          <td><strong>${alerta.descripcion}</strong></td>
          <td>${detalles}</td>
          <td>${fechaGeneracion}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Cargar alertas al inicio
    cargarAlertas();
    
    // Auto-actualizar cada 30 segundos
    setInterval(cargarAlertas, 30000);
  </script>
</body>
</html>
