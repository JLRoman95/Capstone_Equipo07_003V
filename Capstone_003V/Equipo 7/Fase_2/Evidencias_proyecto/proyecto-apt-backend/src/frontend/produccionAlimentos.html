<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Producción de Alimentos (PCC2)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Barra superior -->
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-gray-800">Formularios de Control de Cocina</h1>
    <div style="display: none;">
      <span id="nombreUsuario" class="font-semibold text-gray-700">Cargando...</span>
    </div>

    
  </header>

  <!-- Contenedor principal -->
  <main class="flex-grow flex justify-center items-start mt-6">
    <div class="p-6 w-full max-w-6xl bg-white rounded-xl shadow-md">
      <!-- Botón de volver -->
      <div class="mb-4">
        <button onclick="window.location.href='index.html'" style="display: inline-block; background-color: #007BFF; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 14px; margin-bottom: 20px;">
          ← Volver
        </button>
      </div>

      <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Registro de Producción de Alimentos (PCC2)</h2>

      <!-- Datos del usuario -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <p><strong>Usuario:</strong> <span id="nombreUsuarioDetalle" class="text-gray-700">Cargando...</span></p>
          <p class="text-sm text-gray-500 mt-1">
            🕐 <span id="fechaHoraActual">Fecha y hora actuales</span>
          </p>
        </div>
        <div>
          <label class="block font-semibold mb-1">Turno:</label>
          <select id="turno" class="border rounded px-3 py-2 w-full">
            <option value="">Seleccionar</option>
            <option value="Mañana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
          </select>
        </div>
      </div>

      <!-- Tabla de producción -->
      <div class="overflow-x-auto">
        <table id="tablaProduccion" class="w-full border border-gray-300 text-sm">
          <thead>
            <tr class="bg-gray-100 text-left">
              <th class="p-2">Producto</th>
              <th class="p-2">Cantidad</th>
              <th class="p-2">Temp. Cocción (°C)</th>
              <th class="p-2">Tiempo</th>
              <th class="p-2">Observaciones</th>
              <th class="p-2">Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Botones -->
      <div class="flex flex-col items-center mt-6 space-y-4">
        <button id="btnAgregarFila" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded">
          ➕ Agregar Fila
        </button>
        <button id="btnGuardarProduccion" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg shadow-md">
          ✅ Registrar Producción
        </button>
      </div>
    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:4000/api';
    let listaProductos = [];
    let usuarioActual = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Debes iniciar sesión.');
        window.location.href = '/login.html';
        return;
      }

      try {
        // Obtener usuario logueado
        const resUser = await fetch(`${API_URL}/auth/usuario`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const user = await resUser.json();
        usuarioActual = user;
        document.getElementById('nombreUsuario').textContent = user.nombre;
        document.getElementById('nombreUsuarioDetalle').textContent = user.nombre;

        // Obtener lista de productos
        const resProd = await fetch(`${API_URL}/productos`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        listaProductos = await resProd.json();

        // Agregar fila inicial
        agregarFila();
        
        // Mostrar fecha y hora actual
        actualizarFechaHora();
        setInterval(actualizarFechaHora, 1000); // Actualizar cada segundo
      } catch (error) {
        console.error('Error al cargar datos:', error);
        document.getElementById('nombreUsuario').textContent = 'Error al cargar';
        document.getElementById('nombreUsuarioDetalle').textContent = 'Error al cargar';
      }
    });

    function actualizarFechaHora() {
      const ahora = new Date();
      const fechaFormateada = ahora.toLocaleDateString('es-ES', {
        day: '2-digit',
        month: '2-digit', 
        year: 'numeric'
      });
      const horaFormateada = ahora.toLocaleTimeString('es-ES', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      
      document.getElementById('fechaHoraActual').textContent = `${fechaFormateada} ${horaFormateada}`;
    }

    function agregarFila() {
      const tbody = document.querySelector('#tablaProduccion tbody');
      const fila = document.createElement('tr');

      // Producto
      const tdProducto = document.createElement('td');
      const selectProd = document.createElement('select');
      selectProd.className = 'producto border rounded px-2 py-1 w-full';
      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = 'Seleccionar producto';
      selectProd.appendChild(defaultOption);
      listaProductos.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id_producto;
        opt.textContent = p.nombre;
        selectProd.appendChild(opt);
      });
      tdProducto.appendChild(selectProd);
      fila.appendChild(tdProducto);

      // Cantidad
      const tdCantidad = document.createElement('td');
      const inputCant = document.createElement('input');
      inputCant.type = 'number';
      inputCant.className = 'cantidad border rounded px-2 py-1 w-full';
      tdCantidad.appendChild(inputCant);
      fila.appendChild(tdCantidad);

      // Temp Cocción
      const tdTemp = document.createElement('td');
      const inputTemp = document.createElement('input');
      inputTemp.type = 'number';
      inputTemp.className = 'temp border rounded px-2 py-1 w-full';
      tdTemp.appendChild(inputTemp);
      fila.appendChild(tdTemp);

      // Hora
      const tdHora = document.createElement('td');
      const inputHora = document.createElement('input');
      inputHora.type = 'time';
      inputHora.className = 'hora border rounded px-2 py-1 w-full';
      tdHora.appendChild(inputHora);
      fila.appendChild(tdHora);

      // Observaciones (opcional)
      const tdObs = document.createElement('td');
      const inputObs = document.createElement('input');
      inputObs.className = 'obs border rounded px-2 py-1 w-full';
      tdObs.appendChild(inputObs);
      fila.appendChild(tdObs);

      // Botón eliminar fila
      const tdAccion = document.createElement('td');
      const btnEliminar = document.createElement('button');
      btnEliminar.textContent = '❌';
      btnEliminar.className = 'bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded';
      btnEliminar.onclick = () => fila.remove();
      tdAccion.appendChild(btnEliminar);
      fila.appendChild(tdAccion);

      tbody.appendChild(fila);
    }

    document.getElementById('btnAgregarFila').addEventListener('click', agregarFila);

    document.getElementById('btnGuardarProduccion').addEventListener('click', async () => {
      const turno = document.getElementById('turno').value;

      if (!turno) {
        alert('Por favor selecciona el turno.');
        return;
      }

      const filas = document.querySelectorAll('#tablaProduccion tbody tr');
      const registros = [];

      filas.forEach(fila => {
        const id_producto = fila.querySelector('.producto').value;
        const cantidad = fila.querySelector('.cantidad').value;
        const temp = fila.querySelector('.temp').value;
        const hora = fila.querySelector('.hora').value;
        const obs = fila.querySelector('.obs').value;

        if (id_producto && cantidad) {
          registros.push({
            id_producto: parseInt(id_producto),
            cantidad: parseFloat(cantidad),
            temp: temp ? parseFloat(temp) : null,
            hora: hora || null,
            obs: obs || null
          });
        }
      });

      if (registros.length === 0) {
        alert('Debe ingresar al menos un producto válido.');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/produccion`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            Authorization: `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ 
            turno, 
            responsable: usuarioActual.nombre,
            registros
          })
        });

        const data = await response.json();
        
        if (response.status === 401) {
          alert('Sesión expirada. Debes iniciar sesión nuevamente.');
          localStorage.clear();
          window.location.href = 'login.html';
          return;
        }
        
        if (response.status === 403) {
          alert(data.error || 'No tienes permisos para registrar producciones');
          return;
        }
        
        if (!response.ok) throw new Error(data.message || 'Error al registrar la producción');
        
        const fechaActual = new Date().toLocaleDateString('es-ES');
        const horaActual = new Date().toLocaleTimeString('es-ES');
        alert(`✅ Producción registrada correctamente\n📅 Fecha: ${fechaActual}\n🕐 Hora: ${horaActual}`);
        location.reload();
      } catch (err) {
        console.error('Error al registrar la producción:', err);
        alert(`❌ Error al registrar la producción: ${err.message}`);
      }
    });
  </script>
</body>
</html>
