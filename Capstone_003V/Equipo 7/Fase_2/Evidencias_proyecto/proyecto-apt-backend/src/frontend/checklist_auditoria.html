<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría de Checklists - APT</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    tr:nth-child(even) { background-color: #fafafa; }
    .detalle-btn { cursor: pointer; color: blue; text-decoration: underline; }
    .items-table { margin-top: 10px; width: 95%; border: 1px solid #ddd; }
    .hidden { display: none; }

    /* Estilo del botón de volver */
    .volver {
      display: inline-block;
      background-color: #007BFF;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .volver:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <button class="volver" onclick="window.location.href='index.html'">← Volver</button>
  <h1>Auditoría de Checklists</h1>

  <table id="checklists-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Turno</th>
        <th>ID Usuario</th>
        <th>Usuario</th>
        <th>Estado</th>
        <th>Detalles</th>
      </tr>
    </thead>
    <tbody>
      <!-- Checklists se insertarán aquí -->
    </tbody>
  </table>

  <script>
    const API_BASE = "http://localhost:4000/api"; // Cambia si tu backend corre en otro puerto

    // Verificar autenticación
    const token = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario'));
    if (!token || !usuario) {
      alert('Debes iniciar sesión para acceder a la auditoría');
      window.location.href = 'login.html';
    }

    // Helper para hacer peticiones autenticadas
    async function fetchWithAuth(url, options = {}) {
      const config = {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...options.headers
        }
      };
      
      const response = await fetch(url, config);
      
      if (response.status === 401) {
        alert('Sesión expirada. Debes iniciar sesión nuevamente.');
        window.location.href = 'login.html';
        return;
      }
      
      return response;
    }

    async function fetchChecklists() {
      try {
        const res = await fetchWithAuth(`${API_BASE}/checklists`);
        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || 'Error al cargar checklists');
        }
        const data = await res.json();
        // Ordenar por fecha descendente
        data.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        renderChecklists(data);
      } catch (err) {
        console.error("Error al cargar checklists:", err);
        alert('Error al cargar checklists: ' + err.message);
        document.querySelector("#checklists-table tbody").innerHTML = '<tr><td colspan="7">Error al cargar checklists</td></tr>';
      }
    }

    function renderChecklists(checklists) {
      const tbody = document.querySelector("#checklists-table tbody");
      tbody.innerHTML = "";

      checklists.forEach(c => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${c.id_checklist}</td>
          <td>${c.fecha}</td>
          <td>${c.turno}</td>
          <td>${c.id_usuario}</td>
          <td>${c.usuario_nombre}</td>
          <td>${c.estado}</td>
          <td><span class="detalle-btn" onclick="verDetalles(${c.id_checklist}, this)">Ver ítems</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function verDetalles(id, btn) {
      // Si ya se mostró, ocultar
      if (btn.nextElementSibling && btn.nextElementSibling.classList.contains('items-table')) {
        btn.nextElementSibling.remove();
        return;
      }

      try {
        const res = await fetchWithAuth(`${API_BASE}/checklists/${id}/items`);
        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || 'Error al cargar ítems');
        }
        const items = await res.json();

        const table = document.createElement("table");
        table.classList.add("items-table");
        const header = document.createElement("thead");
        header.innerHTML = `<tr>
          <th>Ítem</th>
          <th>Resultado</th>
          <th>Observación</th>
        </tr>`;
        table.appendChild(header);

        const body = document.createElement("tbody");
        items.forEach(i => {
          const tr = document.createElement("tr");
          const resultadoTexto = i.resultado === 'ok' ? '✅ OK' : 
                               i.resultado === 'no_ok' ? '❌ No OK' : 
                               i.resultado === 'na' ? '⚪ N/A' : i.resultado;
          tr.innerHTML = `
            <td>${i.descripcion}</td>
            <td>${resultadoTexto}</td>
            <td>${i.observacion || "-"}</td>
          `;
          body.appendChild(tr);
        });
        table.appendChild(body);

        btn.parentNode.appendChild(table);
      } catch (err) {
        console.error("Error al cargar ítems:", err);
        alert('Error al cargar ítems: ' + err.message);
      }
    }

    // Inicializar
    fetchChecklists();
  </script>
</body>
</html>
