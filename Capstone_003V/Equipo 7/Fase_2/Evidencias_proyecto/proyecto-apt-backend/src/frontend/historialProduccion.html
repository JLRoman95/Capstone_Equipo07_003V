<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial de Producción | PCC2</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Barra superior -->
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-gray-800">Historial de Producción de Alimentos</h1>
  </header>

  <main class="flex-grow p-6">
    <!-- Botón de volver -->
    <div class="mb-4">
      <button onclick="window.location.href='index.html'" 
        style="display: inline-block; background-color: #007BFF; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 14px; margin-bottom: 20px;">
        ← Volver
      </button>
    </div>
    <div id="produccionesContainer">
    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:4000/api';

    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Debes iniciar sesión.');
        window.location.href = '/login.html';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/produccion`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Error al obtener el historial de producción');

        const data = await res.json();

        // Agrupar productos por id_produccion
        const produccionesMap = {};
        data.forEach(item => {
          if (!produccionesMap[item.id_produccion]) {
            produccionesMap[item.id_produccion] = {
              fecha: item.fecha,
              hora_registro: item.hora_registro,
              responsable: item.responsable,
              turno: item.turno,
              productos: []
            };
          }
          produccionesMap[item.id_produccion].productos.push({
            nombre: item.producto,
            cantidad: item.cantidad,
            temp_coccion: item.temp_coccion,
            hora: item.hora,
            observaciones: item.observaciones
          });
        });

        // Ordenar por fecha y hora descendente (más recientes primero)
        const produccionesOrdenadas = Object.entries(produccionesMap)
          .sort((a, b) => {
            // Crear objetos Date completos con fecha y hora
            const fechaA = new Date(a[1].fecha);
            const fechaB = new Date(b[1].fecha);
            
            // Si las fechas son diferentes, ordenar por fecha
            if (fechaA.getTime() !== fechaB.getTime()) {
              return fechaB - fechaA; // Más reciente primero
            }
            
            // Si las fechas son iguales, ordenar por hora
            const horaA = a[1].hora_registro || '00:00:00';
            const horaB = b[1].hora_registro || '00:00:00';
            
            return horaB.localeCompare(horaA); // Hora más reciente primero
          });

        const container = document.getElementById('produccionesContainer');
        container.innerHTML = '';

        // Agregar contador de registros
        const contadorDiv = document.createElement('div');
        contadorDiv.className = 'mb-4 text-sm text-gray-600';
        contadorDiv.textContent = `📊 Total de registros de producción: ${produccionesOrdenadas.length}`;
        container.appendChild(contadorDiv);

        produccionesOrdenadas.forEach(([id, prod]) => {
          const prodDiv = document.createElement('div');
          prodDiv.className = 'border rounded-lg mb-4 overflow-hidden';

          // Resumen de producción
          const resumen = document.createElement('button');
          resumen.className = 'w-full bg-gray-200 px-4 py-2 text-left font-semibold hover:bg-gray-300';
          
          // Formatear fecha y hora de manera más clara
          const fechaObj = new Date(prod.fecha);
          const fechaFormateada = fechaObj.toLocaleDateString('es-ES', {
            day: '2-digit',
            month: '2-digit', 
            year: 'numeric'
          });
          const horaFormateada = prod.hora_registro ? prod.hora_registro.substring(0, 5) : 'N/A'; // Solo HH:MM
          
          resumen.textContent = `📅 ${fechaFormateada} 🕐 ${horaFormateada} | ID: ${id} | ${prod.responsable} (${prod.turno})`;
          resumen.onclick = () => detalles.classList.toggle('hidden');

          // Detalles de productos
          const detalles = document.createElement('div');
          detalles.className = 'hidden bg-gray-50 p-4';

          const table = document.createElement('table');
          table.className = 'w-full text-sm border border-gray-300';
          const thead = document.createElement('thead');
          thead.innerHTML = `
            <tr class="bg-gray-100">
              <th class="p-2 border">Producto</th>
              <th class="p-2 border">Cantidad</th>
              <th class="p-2 border">Temp. Cocción</th>
              <th class="p-2 border">Tiempo de Cocción</th>
              <th class="p-2 border">Observaciones</th>
            </tr>
          `;
          const tbody = document.createElement('tbody');

          prod.productos.forEach(p => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-200';
            tr.innerHTML = `
              <td class="p-2 border">${p.nombre}</td>
              <td class="p-2 border">${p.cantidad}</td>
              <td class="p-2 border">${p.temp_coccion ?? ''}</td>
              <td class="p-2 border">${p.hora ?? ''}</td>
              <td class="p-2 border">${p.observaciones ?? ''}</td>
            `;
            tbody.appendChild(tr);
          });

          table.appendChild(thead);
          table.appendChild(tbody);
          detalles.appendChild(table);

          prodDiv.appendChild(resumen);
          prodDiv.appendChild(detalles);
          container.appendChild(prodDiv);
        });

      } catch (err) {
        console.error(err);
        alert('❌ Error al cargar el historial de producción.');
      }
    });
  </script>
</body>
</html>
