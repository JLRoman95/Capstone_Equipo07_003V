<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Checklist APT</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    button { padding: 5px 10px; margin-top: 10px; }
    input[type="text"] { width: 90%; }
  </style>
</head>
<body>
  <h2>Checklist de Limpieza</h2>

  <label>Fecha: <input type="date" id="fecha" value=""></label>
  <label>Turno:
    <select id="turno">
      <option value="Mañana">Mañana</option>
      <option value="Tarde">Tarde</option>
      <option value="Noche">Noche</option>
    </select>
  </label>
  <label>ID Usuario: <input type="number" id="id_usuario" value="1"></label>
  <button onclick="crearChecklist()">Crear Checklist</button>

  <h3>Items del Checklist</h3>
  <table id="tabla-items">
    <thead>
      <tr>
        <th>Descripción</th>
        <th>OK</th>
        <th>NO OK</th>
        <th>N/A</th>
        <th>Observación</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button onclick="guardarChecklist()">Guardar Checklist</button>

  <script>
    let checklistId = null;
    let items = [];

    async function crearChecklist() {
      const fecha = document.getElementById('fecha').value;
      const turno = document.getElementById('turno').value;
      const id_usuario = parseInt(document.getElementById('id_usuario').value);

      const res = await fetch('http://localhost:4000/api/checklists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha, turno, id_usuario })
      });

      const data = await res.json();
      checklistId = data.id_checklist;
      items = data.items;

      renderItems();
    }

    function renderItems() {
      const tbody = document.querySelector('#tabla-items tbody');
      tbody.innerHTML = '';
      items.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.descripcion}</td>
          <td><input type="radio" name="res-${index}" value="ok"></td>
          <td><input type="radio" name="res-${index}" value="no_ok"></td>
          <td><input type="radio" name="res-${index}" value="na"></td>
          <td><input type="text" id="obs-${index}" value=""></td>
        `;
        tbody.appendChild(row);
      });
    }

    async function guardarChecklist() {
      if (!checklistId) { alert('Crea un checklist primero'); return; }

      const itemsUpdate = items.map((item, index) => {
        const radios = document.getElementsByName(`res-${index}`);
        let resultado = 'pendiente';
        radios.forEach(r => { if (r.checked) resultado = r.value; });
        const observacion = document.getElementById(`obs-${index}`).value;
        return { id_item: item.id_item, resultado, observacion };
      });

      const res = await fetch(`http://localhost:4000/api/checklists/${checklistId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: itemsUpdate })
      });

      const data = await res.json();
      alert(`Checklist guardado! Estado: ${data.estado}`);
    }
  </script>
</body>
</html>
